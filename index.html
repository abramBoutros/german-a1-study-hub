<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>German A1 — Master Study Hub (Kapitel 2–9)</title>
  <meta name="description" content="Interactive German A1 Study Hub covering Kapitel 2–9: nouns in all forms, conjugated verbs, chapter grammar, software engineering extras, mastery tracking, audio playback & 4-mode practice lab." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

  <div class="app-shell">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-flag" aria-hidden="true"></div>
        <div>
          <h1>German A1</h1>
          <p>Editorial Study Studio · K2–K9</p>
        </div>
        <button class="sidebar-close-btn" id="sidebarCloseBtn" aria-label="Close menu">✕</button>
      </div>

      <div id="sidebarMastery"></div>

      <div>
        <div class="nav-section-label">Overview &amp; Practice</div>
        <div class="nav-list" id="nav-global"></div>
      </div>

      <div>
        <div class="nav-section-label">Chapters (Kapitel 2–9)</div>
        <div class="nav-list" id="nav-chapters"></div>
      </div>

      <div class="gender-legend">
        <div class="gender-legend-title">Article Color System</div>
        <div class="legend-row">
          <span class="art-der">der · Masc</span>
          <span class="art-das">das · Neut</span>
          <span class="art-die">die · Fem</span>
          <span class="g-p">die · Pl</span>
        </div>
      </div>
    </aside>

    <!-- Main Area -->
    <main class="main">
      <header class="topbar">
        <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Toggle Menu">☰</button>
        <div class="search-wrap">
          <span class="search-icon">🔍</span>
          <input
            type="text"
            id="globalSearch"
            placeholder="Search German or English word, plural, verb, grammar…"
            autocomplete="off"
          />
          <kbd class="search-kbd" id="searchKbd">/</kbd>
          <button class="search-clear" id="searchClear" aria-label="Clear search">✕</button>
        </div>

        <div class="topbar-controls">
          <button class="cheatsheet-btn" id="cheatSheetBtn" title="Quick Grammar Cheat-Sheet (Press G)">
            📖 <span>Grammar</span> <kbd>G</kbd>
          </button>

          <div class="audio-popover-wrap" id="audioPopoverWrap">
            <button class="audio-trigger-btn" id="audioTriggerBtn" title="Audio speed & playback controls">
              🔊 <span id="audioSpeedLabel">0.85×</span>
            </button>
            <div class="audio-popover" id="audioPopover">
              <div class="audio-popover-title">
                <span>German Audio Speed</span>
                <button class="speed-stop" id="audioStopBtn" title="Stop audio">⏹ Stop</button>
              </div>
              <div class="audio-popover-row">
                <button class="speed-btn" data-speed="0.5">0.5×</button>
                <button class="speed-btn" data-speed="0.7">0.7×</button>
                <button class="speed-btn" data-speed="0.85">0.85×</button>
                <button class="speed-btn" data-speed="1">1×</button>
              </div>
            </div>
          </div>

          <button class="icon-btn" id="themeToggle" title="Toggle Dark/Light Theme">🌙</button>
        </div>
      </header>

      <div class="content-inner" id="contentRoot"></div>
    </main>
  </div>

  <!-- Slide-Over Quick Grammar Cheat-Sheet Drawer -->
  <div class="drawer-backdrop" id="drawerBackdrop"></div>
  <aside class="grammar-drawer" id="grammarDrawer" aria-hidden="true" aria-label="Quick German A1 Grammar Cheat-Sheet">
    <div class="drawer-header">
      <div>
        <h3 class="drawer-title">Quick Grammar Sheet</h3>
        <p class="drawer-subtitle">A1 Essential Tables &amp; Formulas · Press <kbd>G</kbd></p>
      </div>
      <button class="drawer-close" id="drawerClose" aria-label="Close grammar drawer">✕</button>
    </div>
    <div class="drawer-tabs" id="grammarDrawerTabs" role="tablist"></div>
    <div class="drawer-body" id="grammarDrawerBody"></div>
    <div class="drawer-footer">
      <span><kbd>1</kbd>–<kbd>5</kbd> Tabs · <kbd>Esc</kbd> Close</span>
      <button class="btn-link" id="jumpFullGrammarBtn">Full Chapter Guides →</button>
    </div>
  </aside>

  <button class="scroll-top-btn" id="scrollTopBtn" title="Back to top" aria-label="Back to top">↑</button>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- Load Chapter Data & Modules -->
  <script src="data-ch2-4.js"></script>
  <script src="data-ch5-6.js"></script>
  <script src="data-ch7-8.js"></script>
  <script src="data-ch9.js"></script>
  <script src="ex-translations.js"></script>
  <script src="grammar-drawer.js"></script>
  <script src="exam-bank.js"></script>
  <script src="app.js"></script>
</body>
</html>
